/* ---------- subject abbreviation expansion ----------
   Matching is exact on the trimmed subject line, so running this twice is harmless: an
   already-expanded name no longer matches any key. Lines like "(2-7)" are left untouched.
*/
const SUBJECT_ABBREV = {
  '지시과': '지구시스템과학',
  '지구과학시스템': '지구시스템과학', // corrects timetables already expanded with the old wording
  '한지탐': '한국지리 탐구',
  '물질': '물질과 에너지',
  '역학': '역학과 에너지',
  '인수': '인공지능 수학',
  '인공': '인공지능 기초',
  '융과탐': '융합과학탐구',
  '법사': '법과 사회',
  '윤사': '윤리와 사상',
  '사문탐': '사회문제 탐구',
  '동역': '동아시아 역사 기행',
  '일회': '일본어 회화'
};
function expandSubjectCell(cell){
  if(!cell) return cell;
  return cell.split('\n').map(line => {
    const trimmed = line.trim();
    if(SUBJECT_ABBREV[trimmed]) return SUBJECT_ABBREV[trimmed];
    // also handle the abbreviation sitting on the same line as the class, e.g. "지시과(2-7)"
    for(const key of Object.keys(SUBJECT_ABBREV)){
      if(trimmed.startsWith(key)){
        const rest = trimmed.slice(key.length);
        if(rest.startsWith('(')) return SUBJECT_ABBREV[key] + rest;
      }
    }
    return line;
  }).join('\n');
}

async function applyImportedTimetables_20260831(){
  if(!confirm('업로드해주신 파일 기준으로 20801~20824 전체 시간표를 덮어씁니다. 계속할까요?')) return;
  const count = Object.keys(TT_IMPORT_20260831).length;
  try{ await updateTimetables(Object.assign({}, TT_IMPORT_20260831)); }catch(e){ return; }
  if(state.ttEditor.open && state.ttEditor.no && TT_IMPORT_20260831[state.ttEditor.no]){
    state.ttEditor.grid = TT_IMPORT_20260831[state.ttEditor.no];
  }
  showToast(count + '명의 시간표를 새로 적용했어요.');
  render();
}
async function expandAllTimetableAbbrevs(){
  let changed = 0;
  const updates = {};
  try{
    if(!(await ensureConfirmed('allthing-timetables', 'timetablesConfirmed'))) return;
    Object.keys(state.timetables).forEach(no => {
      const grid = state.timetables[no] || {};
      const newGrid = {};
      let touched = false;
      Object.keys(grid).forEach(day => {
        newGrid[day] = (grid[day] || []).map(cell => {
          const out = expandSubjectCell(cell);
          if(out !== cell){ changed++; touched = true; }
          return out;
        });
      });
      if(touched) updates[no] = newGrid; // only students whose timetable actually changed
    });
    if(changed > 0) await updateTimetables(updates);
  }catch(e){ return; }
  if(changed === 0){ showToast('바꿀 줄임말이 없어요.'); return; }
  if(state.ttEditor.open && state.ttEditor.no){
    state.ttEditor.grid = state.timetables[state.ttEditor.no] || state.ttEditor.grid;
  }
  showToast(changed + '개 칸의 줄임말을 펼쳤어요.');
  render();
}

/* ---------- home view ---------- */
function homeMealSummary(){
  const t = state.meals.find(m => m.date === todayStr());
  const html = t ? mealGroupsHtml(t) : '';
  if(!html) return `<p class="text-2">오늘은 급식 정보가 없어요.</p>`;
  return html;
}
function homeTimetableSummary(){
  const u = me();
  const day = WEEKDAY_KO[new Date().getDay()];
  if(!DAYS.includes(day)) return `<p class="text-2">오늘은 등교하지 않는 날이에요.</p>`;
  if(!u.studentNo || !state.timetables[u.studentNo]) return `<p class="text-2">아직 시간표가 없어요.</p>`;
  const grid = state.timetables[u.studentNo];
  const list = PERIODS.map((p,i)=>({ p, s: (grid[day]||[])[i] || '' })).filter(x => x.s);
  if(list.length === 0) return `<p class="text-2">오늘은 등록된 수업이 없어요.</p>`;
  return `<div class="mini-list">${list.map(x=>`<div class="mini-row"><span class="mini-p">${x.p}교시</span><span>${esc(x.s)}</span></div>`).join('')}</div>`;
}
function homeUpcomingExams(){
  const list = state.exams.filter(x => (x.endDate || x.date) >= todayStr()).slice(0,2);
  if(list.length === 0) return `<p class="text-2">${SECTIONS.exams.emptyMsg}</p>`;
  return `<div class="mini-list">${list.map(it => {
    const dd = dDayInfo(it.date, it.endDate);
    return `<div class="mini-row"><span class="dday sm ${dd.cls}">${dd.label}</span><span>${esc(it.subject)} · ${esc(it.title)}</span></div>`;
  }).join('')}</div>`;
}
function homeUpcomingEvents(){
  const list = state.events.filter(x => (x.endDate || x.date) >= todayStr()).slice(0,2);
  if(list.length === 0) return `<p class="text-2">${SECTIONS.events.emptyMsg}</p>`;
  return `<div class="mini-list">${list.map(it => {
    const dd = dDayInfo(it.date, it.endDate);
    return `<div class="mini-row"><span class="dday sm ${dd.cls}">${dd.label}</span><span>${esc(it.title)}</span></div>`;
  }).join('')}</div>`;
}
function renderHome(){

  const now = new Date();
  const dateLabel = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${WEEKDAY_KO[now.getDay()]})`;
  const showDefaultPwHint = !!u.pwDefault;
  return `
  <div class="home-greeting">
    <h2>안녕, ${esc(u.displayName)}님 👋</h2>

  ${showDefaultPwHint ? `

  </div>` : ''}
  ${renderInstallBanner()}
  <div class="home-grid">
    <div class="card home-card">
      <div class="home-card-head"><h3>${icon('meal')} 오늘의 급식</h3><button class="link-btn" data-act="goto" data-view="meals">더보기 ${icon('chevron')}</button></div>
      ${homeMealSummary()}
    </div>
    <div class="card home-card">
      <div class="home-card-head"><h3>${icon('timetable')} 오늘의 시간표</h3><button class="link-btn" data-act="goto" data-view="timetable">더보기 ${icon('chevron')}</button></div>
      ${homeTimetableSummary()}
    </div>
    <div class="card home-card">
      <div class="home-card-head"><h3>${icon('exam')} 다가오는 수행평가·시험</h3><button class="link-btn" data-act="goto" data-view="exams">더보기 ${icon('chevron')}</button></div>
      ${homeUpcomingExams()}

    <div class="card home-card">
      <div class="home-card-head"><h3>${icon('event')} 다가오는 일정</h3><button class="link-btn" data-act="goto" data-view="events">더보기 ${icon('chevron')}</button></div>
      ${homeUpcomingEvents()}
    </div>
  </div>
  `;
}

let cashBusy = false;
async function submitCashAdjust(sign){
  const idEl = document.getElementById('cashTarget'), amEl = document.getElementById('cashAmount'), reEl = document.getElementById('cashReason');
  if(!idEl || cashBusy) return;
  const id = idEl.value, amount = Math.floor(Number(amEl.value)), reason = reEl.value.trim();
  state.cashForm = { id, amount: amEl.value, reason };
  if(!id){ showToast('대상을 골라주세요.', 'err'); return; }
  if(!(amount > 0)){ showToast('금액을 1원 이상으로 입력해주세요.', 'err'); return; }
  if(!reason){ showToast('사유를 적어주세요.', 'err'); return; }
  const name = (state.users[id] || {}).displayName || id;
  if(!confirm(name + (sign > 0 ? '에게 ' : '에게서 ') + fmtWon(amount) + (sign > 0 ? '을 넣을까요?' : '을 뺄까요?') + '\n사유: ' + reason)) return;
  cashBusy = true;
  const r = await apiToast('game', { action:'adjustCash', id, amount: sign > 0 ? amount : -amount, reason });
  cashBusy = false;
  if(!r) return;
  state.cashForm = { id };
  if(state.game){ state.game.ranking = null; state.game.log = null; }
  showToast(r.message);
}

/* ---------- splash animation ---------- */
function playSplash(){
  if(state.currentUser) return;
  const word = document.getElementById('morphWord');
  const heroEl = document.getElementById('hero');
  const card = document.getElementById('loginCard');
  if(!word || !heroEl) return;

  // 초기 상태: 흰색 '모든 것', 화면 중앙에 크게
  word.classList.remove('morphed','shake','pop','charge');
  word.textContent = '모든 것';
  heroEl.classList.remove('compact');
  if(card) card.classList.add('pending');

  // 브라우저가 흰색 글자를 렌더링하도록 다음 프레임에서 애니메이션 시작
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      // 1. 아쿠아색으로 물드는 효과 시작
      word.classList.add('charge');

      // 2. 0.85초 후 텍스트 흔들림
      setTimeout(() => word.classList.add('shake'), 850);

      // 3. 1.3초 후 폭죽 효과 + 'All thing' 교체 + 팝 효과
      setTimeout(() => {
        burstConfetti(word);
        word.classList.remove('shake','charge');
        word.textContent = 'All thing';
        word.classList.add('morphed','pop');
      }, 1300);

      // 4. 1.85초 후 (폭죽이 잠시 보인 다음) 제목이 로그인 화면 상단 자리로 축소 이동 + 로그인 카드 등장
      setTimeout(() => {
        // re-find the elements: a toast (e.g. "다시 로그인해주세요") may have re-rendered the screen meanwhile
        const h = document.getElementById('hero') || heroEl, c = document.getElementById('loginCard') || card;
        const w = document.getElementById('morphWord');
        h.classList.add('compact');
        if(w && !w.classList.contains('morphed')){ w.textContent = 'All thing'; w.classList.add('morphed'); }
        if(c){ c.classList.remove('pending'); c.classList.add('show'); }
        state.splashPlayed = true;
      }, 1850);
    });
  });
}
function burstConfetti(targetEl){
  const rect = targetEl.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const colors = ['#838952','#6B7143','#B8752E','#FFFCF5','#A9AE7C'];
  let root = document.getElementById('confettiRoot');
  if(!root){
    root = document.createElement('div');
    root.id = 'confettiRoot';
    root.className = 'confetti-root';
    document.body.appendChild(root);
  }
  const count = 34;
  for(let i=0;i<count;i++){
    const p = document.createElement('span');
    const isBar = Math.random() < 0.35;
    p.className = 'confetti-piece ' + (isBar ? 'bar' : 'dot');
    const angle = Math.random() * Math.PI * 2;
    const dist1 = 26 + Math.random()*42;
    const dist2 = dist1 + 22 + Math.random()*42;
    const tx1 = Math.cos(angle)*dist1, ty1 = Math.sin(angle)*dist1;
    const tx2 = Math.cos(angle)*dist2*0.6, ty2 = ty1 + 40 + Math.random()*46;
    const size = isBar ? (3+Math.random()*2.4) : (3.5+Math.random()*3.5);
    p.style.left = cx+'px';
    p.style.top = cy+'px';
    p.style.setProperty('--tx1', tx1.toFixed(1)+'px');
    p.style.setProperty('--ty1', ty1.toFixed(1)+'px');
    p.style.setProperty('--tx2', tx2.toFixed(1)+'px');
    p.style.setProperty('--ty2', ty2.toFixed(1)+'px');
    p.style.setProperty('--rot', (Math.random()*540-270).toFixed(0)+'deg');
    p.style.setProperty('--size', size.toFixed(1)+'px');
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (620+Math.random()*420)+'ms';
    p.style.animationDelay = (Math.random()*90)+'ms';
    root.appendChild(p);
  }
  setTimeout(() => { root.innerHTML = ''; }, 1500);
}

  const wrap = el.parentElement;
  if(!wrap) return;
  const hasOverflow = el.scrollWidth > el.clientWidth + 1;
  const atStart = el.scrollLeft <= 1;
  const atEnd = el.scrollLeft + el.clientWidth >= el.scrollWidth - 1;
  wrap.classList.toggle('at-start', hasOverflow && atStart);
  wrap.classList.toggle('at-end', hasOverflow && atEnd);
}
function isMobileLayoutActive(){
  const sidebar = document.querySelector('.sidebar');
  if(!sidebar) return true;
  return getComputedStyle(sidebar).display === 'none';
}
async function toggleLayout(){
  // Real device rotation only makes sense on an actual touchscreen (phone/tablet) — on desktop,
  // screen.orientation.lock() can trivially "succeed" without doing anything real, which would
  // wrongly skip the manual layout toggle. So only attempt it on touch-primary devices.
  const isTouchDevice = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0;
  try{
    if(isTouchDevice && screen.orientation && screen.orientation.lock){
      if(!document.fullscreenElement && document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen().catch(() => {});
      }
      const current = screen.orientation.type || '';
      const goingLandscape = !current.startsWith('landscape');
      await screen.orientation.lock(goingLandscape ? 'landscape' : 'portrait');
      state.forceLayout = null;
      lsSet('layout-pref', false, null);
      render();
      return;
    }
  }catch(e){ /* not allowed here (plain browser tab) — fall through to the manual toggle */ }
  if(!state.forceLayout){
    state.forceLayout = isMobileLayoutActive() ? 'pc' : 'mobile';
  } else {
    state.forceLayout = state.forceLayout === 'pc' ? 'mobile' : 'pc';
  }
  lsSet('layout-pref', false, state.forceLayout);
  render();
}

/* ---------- resizable / collapsible sidebar ---------- */
const SIDEBAR_MIN = 76;
const SIDEBAR_MAX = 320;
const SIDEBAR_DEFAULT = 236;
const SIDEBAR_COLLAPSE_AT = 130;
function sidebarWidthPref(){
  const w = lsGet('sidebar-width', false, SIDEBAR_DEFAULT);
  return Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, Number(w) || SIDEBAR_DEFAULT));
}
function applySidebarWidth(w){
  document.documentElement.style.setProperty('--sidebar-w', w + 'px');
  const sidebar = document.querySelector('.sidebar');
  if(sidebar) sidebar.classList.toggle('collapsed', w < SIDEBAR_COLLAPSE_AT);
}
(function setupSidebarResize(){
  let dragging = false, startX = 0, startW = SIDEBAR_DEFAULT;
  document.addEventListener('pointerdown', function(e){
    const handle = e.target.closest && e.target.closest('#sidebarResizeHandle');
    if(!handle) return;
    dragging = true;
    startX = e.clientX;
    const sidebar = document.querySelector('.sidebar');
    startW = sidebar ? sidebar.getBoundingClientRect().width : SIDEBAR_DEFAULT;
    handle.classList.add('dragging');
    if(handle.setPointerCapture) { try{ handle.setPointerCapture(e.pointerId); }catch(err){} }
    e.preventDefault();
  });
  document.addEventListener('pointermove', function(e){
    if(!dragging) return;
    const dx = e.clientX - startX;
    let w = Math.round(startW + dx);
    w = Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, w));
    applySidebarWidth(w);
  });
  function stop(){
    if(!dragging) return;
    dragging = false;
    const handle = document.getElementById('sidebarResizeHandle');
    if(handle) handle.classList.remove('dragging');
    const val = getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w');
    const w = parseInt(val) || SIDEBAR_DEFAULT;
    lsSet('sidebar-width', false, w);
  }
  document.addEventListener('pointerup', stop);

})();

function snapshotScroll(){

function restoreScroll(k){
  const set = (el, prop, v) => { if(!el || !v) return; const old = el.style.scrollBehavior; el.style.scrollBehavior = 'auto'; el[prop] = v; el.style.scrollBehavior = old; };
  set(document.getElementById('mainScroll'), 'scrollTop', k.main);
  set(document.getElementById('bottomNavScroll'), 'scrollLeft', k.nav);
  set(document.querySelector('.side-nav'), 'scrollTop', k.side);
  set(document.querySelector('.game-tabs'), 'scrollLeft', k.tabs);
  set(document.querySelector('.modal'), 'scrollTop', k.modal);
  if(k.win && Math.abs(window.scrollY - k.win) > 1){
    const html = document.documentElement, old = html.style.scrollBehavior;
    html.style.scrollBehavior = 'auto'; window.scrollTo(0, k.win); html.style.scrollBehavior = old;

      case 'gameBuyItem': gameBuyItem(el.dataset.item); break;

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      // if a newer sw.js is already waiting (from a previous visit), activate it now
      if(reg.waiting) reg.waiting.postMessage('skipWaiting');
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', () => {
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            nw.postMessage('skipWaiting');
          }
        });
      });
    }).catch(() => {});
    // a new service worker just took control — reload once so the fresh files are used
    let refreshed = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(refreshed) return;
      refreshed = true;
      window.location.reload();
    });
  });
}

/* ---------- swipe left/right between tabs (mobile) ---------- */
(function setupSwipeNav(){
  let startX = 0, startY = 0, touching = false, skip = false, decided = false, horizontal = false;
  const THRESHOLD = 55;
  const DIR_LOCK = 10;
  document.addEventListener('touchstart', function(e){
    if(!state.currentUser || !e.touches || !e.touches[0]) return;
    if(!isMobileLayoutActive()) { skip = true; return; }
    if(state.ttEditor.open || state.editing.section || state.lightboxSrc || document.querySelector('.modal-overlay')) { skip = true; return; }
    skip = !!e.target.closest('.tt-wrap, .tt-edit-wrap, .chip-select, .bottom-nav, .date-pills, .lightbox-overlay, input, textarea');
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY; touching = true; decided = false; horizontal = false;
  }, { passive:true });
  document.addEventListener('touchmove', function(e){
    if(!touching || skip || !e.touches || !e.touches[0]) return;
    const t = e.touches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if(!decided && (Math.abs(dx) > DIR_LOCK || Math.abs(dy) > DIR_LOCK)){
      decided = true;
      horizontal = Math.abs(dx) > Math.abs(dy) * 1.6;
    }
    // Once we know it's a horizontal swipe, tell the browser we're handling it — this stops
    // Samsung/Chrome's own edge-swipe-back and toolbar-hide gestures from firing at the same
    // time as our slide animation, which is what was producing the "bounce".
    if(horizontal && e.cancelable) e.preventDefault();
  }, { passive:false });
  document.addEventListener('touchend', function(e){
    if(!touching) return;
    touching = false;
    if(skip || !e.changedTouches || !e.changedTouches[0]) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if(Math.abs(dx) > THRESHOLD && Math.abs(dx) > Math.abs(dy) * 1.6){
      const nav = visibleNav();
      const idx = nav.findIndex(n => n.key === state.view);
      if(idx === -1) return;
      if(dx < 0 && idx < nav.length - 1){
        goto(nav[idx+1].key, 'enter-right');
      } else if(dx > 0 && idx > 0){
        goto(nav[idx-1].key, 'enter-left');
      }
    }
  }, { passive:true });
})();

/* ---------- press back again to exit ----------
   On mobile, the browser/OS back button normally leaves the app on the very first press,
   which is easy to hit by accident. This pushes a harmless extra history entry so the first
   back press is caught (shown as a toast) instead of leaving; pressing back again within a
   couple seconds lets it through so the app actually closes.
*/
(function setupBackToExit(){
  const EXIT_WINDOW = 2000;
  let lastBackAt = 0;
  let programmaticBack = false;
  function armGuard(){
    try{ history.pushState({ allthingGuard: true }, '', location.href); }catch(e){}
  }
  window.addEventListener('popstate', function(){
    if(programmaticBack){ programmaticBack = false; return; } // our own history.back() below — let it proceed
    const now = Date.now();
    if(lastBackAt && now - lastBackAt < EXIT_WINDOW){
      // second press within the window — go back one more step to actually leave, since the
      // guard entry we pushed points at the same page and wouldn't exit on its own
      lastBackAt = 0;
      programmaticBack = true;
      history.back();
      return;
    }
    lastBackAt = now;
    showToast('뒤로 가기를 한 번 더 누르면 앱이 종료돼요.');
    armGuard();
  });
  armGuard();
  // Some mobile browsers don't fully register a pushState call made this early (right at
  // script load, before the page has "settled" or seen any user interaction) — the very
  // first back press then skips straight past it. Re-arming on load and on the first touch
  // makes sure the guard is in place by the time a real back press can happen.
  window.addEventListener('load', armGuard);
  window.addEventListener('pageshow', armGuard);
  document.addEventListener('touchstart', armGuard, { once:true, capture:true });
  document.addEventListener('click', armGuard, { once:true, capture:true });
})();

const LEGACY_ITEMS = { hintUp:{ name:'상승 힌트', price:50000 }, hintDown:{ name:'하락 경고', price:50000 } };
// 50-minute periods (each starts at :40, ends at :30; lunch 12:30–13:40); buying is locked during these
const CLASS_PERIODS = [['08:40','09:30'],['09:40','10:30'],['10:40','11:30'],['11:40','12:30'],['13:40','14:30'],['14:40','15:30'],['15:40','16:30']];
// how many periods each weekday has (Mon/Tue/Thu end 16:30, Wed 15:30, Fri 14:30)
const PERIODS_BY_WEEKDAY = { 1:7, 2:7, 3:6, 4:7, 5:5 };
const ARC_NAMES = { meal:'급식실의 낯선 트럭', store:'매점의 비밀 박스', library:'도서관의 수상한 포스터', gym:'운동장 측량 장비', break:'의문의 효과음', exam:'시험 기간' };
// 공휴일·대체공휴일 (2026년 남은 날 + 2027년, 정부 월력요항 기준). School-specific days off
// (재량휴업일, 개교기념일, 방학 …) are added by ticking "휴일" on an event in the 일정 tab.
const KR_PUBLIC_HOLIDAYS = new Set([
  '2026-10-05','2026-10-09','2026-12-25',
  '2027-01-01','2027-02-06','2027-02-07','2027-02-08','2027-02-09','2027-03-01',
  '2027-05-01','2027-05-03','2027-05-05','2027-05-13','2027-06-06','2027-07-17','2027-07-19',
  '2027-08-15','2027-08-16','2027-09-14','2027-09-15','2027-09-16','2027-10-03','2027-10-04',
  '2027-10-09','2027-10-11','2027-12-25','2027-12-27'
]);
function dateKey(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function holidayInfo(d){
  const key = dateKey(d);
  if(KR_PUBLIC_HOLIDAYS.has(key)) return { kind:'holiday' };
  const ev = (state.events || []).find(e => e && e.holiday && e.date && e.date <= key && key <= (e.endDate || e.date));
  if(ev) return { kind:'holiday', title: ev.title };
  const wd = d.getDay();
  if(wd === 0 || wd === 6) return { kind:'weekend' };
  return null;
}
// prices rest overnight (every day): ticks from 23:00 up to 06:30 don't move anything
const NIGHT_START = 23*60, NIGHT_END = 7*60;
function isNightMinute(mins){ return mins >= NIGHT_START || mins < NIGHT_END; }
function isFrozenTick(tickNo){ const d = new Date(tickNo * GAME_TICK_MS); return isNightMinute(d.getHours()*60 + d.getMinutes()); }
function stockInfo(id){ return GAME_STOCKS.find(s => s.id === id); }
function gameTickNow(){ return Math.floor(Date.now() / GAME_TICK_MS); }
function hmToMin(str){ const p = str.split(':').map(Number); return p[0]*60 + p[1]; }
function marketStatus(d){
  d = d || new Date();
  const wd = d.getDay();
  const mins = d.getHours()*60 + d.getMinutes();
  const night = isNightMinute(mins);
  const hol = holidayInfo(d);
  if(hol) return { open:true, night, dayKind: hol.kind, holidayTitle: hol.title };
  const count = PERIODS_BY_WEEKDAY[wd] || 0;
  for(let i = 0; i < count; i++){
    if(mins >= hmToMin(CLASS_PERIODS[i][0]) && mins < hmToMin(CLASS_PERIODS[i][1])){
      return { open:false, period:i+1, reopen:CLASS_PERIODS[i][1] };
    }
  }
  return { open:true, night };
}
function nextMovingTick(){ let t = gameTickNow() + 1; for(let i = 0; i < 48 && isFrozenTick(t); i++) t++; return t; }
function nextTickLabel(){ const t = new Date(nextMovingTick() * GAME_TICK_MS); return pad2(t.getHours()) + ':' + pad2(t.getMinutes()); }
function fmtWon(n){ return Math.round(n || 0).toLocaleString('ko-KR') + '원'; }
function stockName(id){ const s = GAME_STOCKS.find(x => x.id === id); return s ? s.name : id; }
function gameRef(sub){ return fbDb.ref(GAME_PATH + (sub ? '/' + sub : '')); }

// 큰 주문은 체결가가 조금 불리해져요 (서버와 같은 계산 — "최대" 수량을 미리 맞추는 데만 써요)
const FLOW_DEPTH = 50000000;
function flowImpact(won){ return Math.max(-0.02, Math.min(0.02, (won || 0) / FLOW_DEPTH * 0.05)); }
function execPrice(side, price, qty){
  const half = Math.abs(flowImpact(price * qty)) / 2;
  return Math.max(10, Math.round(price * (side === 'buy' ? 1 + half : 1 - half) / 10) * 10);
}

/* ---- game control: open / shutdown / test mode ---- */
const GAME_CTRL_DEFAULT = { open:true, test:false, testers:{}, season:'s1' };
function gameCtrl(){ return Object.assign({}, GAME_CTRL_DEFAULT, (state.game && state.game.control) || {}); }
function marketRunning(c){ c = c || gameCtrl(); return !!(c.open || c.test); }
function canPlayGame(){
  const c = gameCtrl();
  if(c.open) return true;
  return !!c.test && (isAdmin() || !!(c.testers || {})[state.currentUser]);
}
function logPath(){ return 'log/' + (gameCtrl().season || 's1'); }

/* ---- 서버와 맞추기: 시세 진행 + 지원금 + 자동 손절·익절 ---- */
async function gameSync(){
  const g = state.game;
  if(!state.currentUser || !canPlayGame() || g.syncing) return;
  g.syncing = true;
  try{
    const r = await api('game', { action:'sync' });
    if(state.game === g && r.messages && r.messages.length) showToast(r.messages.join(' · '));
  }catch(e){
    if(e.status === 401) forceRelogin(e.message);
    else if(e.status !== 403) console.warn('All thing: 게임 동기화 실패 —', e.message);
  }
  g.syncing = false;
}
function playerTotals(p, prices){
  p = p || {}; prices = prices || {};
  let stockValue = 0;
  Object.keys(p.holdings || {}).forEach(id => { stockValue += (p.holdings[id] || 0) * (prices[id] || 0); });
  return { cash: p.cash || 0, stockValue, total: (p.cash || 0) + stockValue };
}
// 내 자동 매도 조건이 시세 기록에서 맞았는지 (맞으면 서버에 처리를 부탁해요)
function findOrderTriggers(orders, m){
  const out = [];
  if(!orders || !m || !m.history) return out;
  Object.keys(orders).forEach(id => {
    const o = orders[id], arr = m.history[o.stock];
    if(!o || !arr || !arr.length) return;
    const first = m.tick - (arr.length - 1);
    for(let t = Math.max((o.tick || 0) + 1, first); t <= m.tick; t++){
      const price = arr[arr.length - 1 - (m.tick - t)];
      if((o.kind === 'stop' && price <= o.trigger) || (o.kind === 'take' && price >= o.trigger)){ out.push({ id, price, tick: t }); break; }
    }
  });
  return out;
}
function checkAutoOrders(){
  const g = state.game;
  if(g.player && g.player.orders && g.market && findOrderTriggers(g.player.orders, g.market).length) gameSync();
}
async function gameAction(body){
  const g = state.game;
  if(g.busy) return null;
  g.busy = true;
  try{ return await apiToast('game', body); }
  finally{ g.busy = false; }
}

/* ---- trading ---- */
async function gameTrade(side, stockId){
  const st = marketStatus();
  if(!st.open && side === 'buy'){ showToast('수업 시간에는 매수할 수 없어요 (매도는 가능해요). ' + st.reopen + '에 다시 열려요.', 'err'); return; }
  const g = state.game;
  if(!g.market || !g.market.prices || !g.playerLoaded){ showToast('시장 정보를 불러오는 중이에요.', 'err'); return; }
  const qty = Math.floor(Number(g.qty[stockId] || 0));
  if(!(qty > 0)){ showToast('수량을 입력해주세요.', 'err'); return; }
  const r = await gameAction({ action:'trade', side, stock: stockId, qty });
  if(!r) return;
  g.qty[stockId] = '';
  showToast(r.message);
}
function gameSetMax(side, stockId){
  const g = state.game, price = g.market && g.market.prices ? g.market.prices[stockId] : 0, p = g.player || {};
  if(side === 'buy'){
    let q = price > 0 ? Math.floor((p.cash || 0) / price) : 0;
    while(q > 0 && execPrice('buy', price, q) * q > (p.cash || 0)) q = Math.max(0, Math.floor(q * 0.995) - (q < 200 ? 1 : 0)); // account for slippage
    g.qty[stockId] = q;
  } else g.qty[stockId] = (p.holdings || {})[stockId] || 0;
  render();
}

/* ---- items ---- */
async function gameBuyItem(itemId){

/* ---- auto stop-loss / take-profit orders ---- */
function openOrderForm(stockId){
  const g = state.game;
  g.orderForm = (g.orderForm && g.orderForm.stock === stockId) ? null : { stock: stockId, kind:'stop', trigger:'', qty:'' };
  render();
}
async function placeAutoOrder(stockId){
  const g = state.game, f = g.orderForm || {}, m = g.market, p = g.player || {};
  if(!m || !m.prices){ showToast('시장 정보를 불러오는 중이에요.', 'err'); return; }
  const now = m.prices[stockId], have = (p.holdings || {})[stockId] || 0;
  const kind = f.kind === 'take' ? 'take' : 'stop';
  const trigger = Math.round(Number(f.trigger || 0) / 10) * 10;
  const sellAll = !String(f.qty || '').trim(); // blank = "everything I hold"
  const qty = sellAll ? null : Math.floor(Number(f.qty));
  if(!(trigger > 0)){ showToast('가격을 입력해주세요.', 'err'); return; }
  if(kind === 'stop' && trigger >= now){ showToast('손절 가격은 지금 가격(' + fmtWon(now) + ')보다 낮아야 해요.', 'err'); return; }
  if(kind === 'take' && trigger <= now){ showToast('익절 가격은 지금 가격(' + fmtWon(now) + ')보다 높아야 해요.', 'err'); return; }
  if(!sellAll && (!(qty > 0) || qty > have)){ showToast('수량은 1주부터 보유한 ' + have + '주까지 정할 수 있어요.', 'err'); return; }
  const r = await gameAction({ action:'placeOrder', stock: stockId, kind, trigger, qty });
  if(!r) return;
  g.orderForm = null;
  showToast(r.message);
}
async function cancelAutoOrder(orderId){
  const r = await gameAction({ action:'cancelOrder', orderId });
  if(r) showToast(r.message);
}
async function useNewsSummary(newsId){
  const g = state.game, p = g.player || {};
  const cur = (p.summaries || {})[newsId];
  if(cur && typeof cur === 'object') return; // already unlocked
  await gameAction({ action:'useSummary', newsId });
}

/* ---- ranking & history ---- */
async function loadGameRanking(){

async function loadGameLog(){

  const q = isAdmin() ? gameRef(logPath()).limitToLast(150) : gameRef(logPath()).orderByChild('uid').equalTo(state.currentUser).limitToLast(100);

/* ---- sync lifecycle ---- */
function renderGameSafe(){
  // don't wipe out a number someone is in the middle of typing
  const a = document.activeElement;
  if(a && a.classList && (a.classList.contains('game-qty') || a.classList.contains('order-input'))){ state.game.pendingRender = true; return; }
  render();
}
function detachPlay(){
  const gg = state.game;
  (gg.playRefs || []).forEach(r => { try{ r.off(); }catch(e){} });
  if(gg.timer) clearInterval(gg.timer);
  Object.assign(gg, { playRefs:[], timer:null, playAttached:false, market:null, player:null, marketLoaded:false, playerLoaded:false });
}
function stopGameSync(){
  const g = state.game;
  detachPlay();
  if(g.ctrlRef){ try{ g.ctrlRef.off(); }catch(e){} }
  state.game = freshGameState();
}
function startGameSync(){
  // only the tiny control node is watched for everyone; the market and wallets are loaded
  // only once someone who is allowed in actually opens the game tab
  const g = state.game;
  if(!state.currentUser || !fbDb || g.syncedFor === state.currentUser) return;
  if(g.syncedFor) stopGameSync();
  const gg = state.game;
  gg.syncedFor = state.currentUser;
  gg.ctrlRef = gameRef('control');
  gg.ctrlRef.on('value', snap => {
    const was = gameCtrl();
    gg.control = snap.val() || null; gg.controlLoaded = true;
    if(!canPlayGame()) detachPlay();
    else if(gg.wantPlay) attachPlay();
    if(gg.playAttached && !marketRunning(was) && marketRunning()) gameSync();
    if(state.view === 'game' || state.view === 'accounts') renderGameSafe();
  }, () => { gg.controlLoaded = true; renderGameSafe(); });
}
function attachPlay(){
  const gg = state.game;
  if(gg.playAttached || !state.currentUser || !canPlayGame()) return;
  gg.playAttached = true;
  const marketRef = gameRef('market');
  const playerRef = gameRef('players/' + state.currentUser);
  gg.playRefs = [marketRef, playerRef];
  marketRef.on('value', snap => {
    if(!gg.playAttached || state.game !== gg) return; // arrived after we disconnected (locked / logged out)
    gg.market = snap.val(); gg.marketLoaded = true;
    if(!gg.market && marketRunning()) gameSync(); // e.g. right after a reset
    const news = (gg.market && gg.market.news) || [], latest = news.length ? news[news.length-1] : null;
    if(latest && gg.lastNewsId !== null && latest.id !== gg.lastNewsId && state.view === 'game'){
      showToast('📰 새 소식: ' + latest.title);
    }
    gg.lastNewsId = latest ? latest.id : '';
    checkAutoOrders();
    if(state.view === 'game'){
      if(gg.tab === 'news' && latest) lsSet('game-news-seen', false, latest.id);
      renderGameSafe();
    }
  });
  playerRef.on('value', snap => {
    if(!gg.playAttached || state.game !== gg) return;
    gg.player = snap.val(); gg.playerLoaded = true;
    if(!gg.player && marketRunning()) gameSync(); // wallet wiped by a reset → start again
    if(state.view === 'game') renderGameSafe();
  });
  gameSync(); // 시세를 지금까지 진행 + 오늘 지원금 + 자동 매도 (전부 서버에서)
  gg.timer = setInterval(() => {
    if(state.view !== 'game') return;
    const key = gameTickNow() + '|' + todayStr() + '|' + JSON.stringify(marketStatus());
    if(key !== gg.statusKey){
      const first = !gg.statusKey;
      gg.statusKey = key;
      if(!first) gameSync();
      renderGameSafe();
    }
  }, 15000);
}
function freshGameState(){
  return { tab:'market', chartOpen:null, orderForm:null, lottoResult:null, lastNewsId:null, market:null, player:null, marketLoaded:false, playerLoaded:false, qty:{}, hint:null,
           ranking:null, log:null, syncedFor:null, playRefs:[], ctrlRef:null, timer:null, statusKey:'', syncing:false, busy:false,
           control:null, controlLoaded:false, wantPlay:false, playAttached:false };
}

/* ---- rendering ---- */
function gameSparkline(arr){
  if(!Array.isArray(arr) || arr.length < 2) return '';
  const w = 90, h = 28, min = Math.min.apply(null, arr), max = Math.max.apply(null, arr), rng = (max - min) || 1;
  const pts = arr.map((v,i) => (i/(arr.length-1)*w).toFixed(1) + ',' + (h - ((v-min)/rng)*(h-2) - 1).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function timeLabel(ms){ const d = new Date(ms); return (d.getMonth()+1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function tickLabel(tickNo){
  const d = new Date(tickNo * GAME_TICK_MS);
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function renderStockChart(s, m){
  const arr = (m.history || {})[s.id] || [];
  if(arr.length < 2) return `<div class="stock-chart"><p class="text-3 small">아직 그래프를 그릴 만큼 기록이 쌓이지 않았어요. 30분마다 한 칸씩 늘어나요.</p></div>`;
  const W = 320, H = 130, P = 6;
  const min = Math.min.apply(null, arr), max = Math.max.apply(null, arr), rng = (max - min) || 1;
  const x = i => P + i * (W - 2*P) / (arr.length - 1);
  const y = v => P + (H - 2*P) * (1 - (v - min) / rng);
  const line = arr.map((v,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const area = line + ` L ${x(arr.length-1).toFixed(1)} ${H - P} L ${x(0).toFixed(1)} ${H - P} Z`;
  const ch = changeInfo(arr[arr.length-1], arr[0]);
  // where each news story about this stock landed on the chart — only for stories I've unlocked with a 뉴스 요약
  const sums = ((state.game.player || {}).summaries) || {};
  const marks = (m.news || []).filter(n => n && summaryStocks(sums[n.id]).indexOf(s.id) !== -1).map(n => {
    const idx = arr.length - 1 - (m.tick - n.tick);
    if(idx < 0 || idx >= arr.length) return '';
    return `<circle cx="${x(idx).toFixed(1)}" cy="${y(arr[idx]).toFixed(1)}" r="4.2" class="news-mark"><title>${esc(n.title)}</title></circle>`;
  }).join('');
  const firstTick = m.tick - (arr.length - 1);
  return `
  <div class="stock-chart ${ch.cls}">
    <div class="chart-head">
      <span>최고 <b>${fmtWon(max)}</b></span><span>최저 <b>${fmtWon(min)}</b></span><span class="${ch.cls}">기간 ${ch.text}</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" class="chart-svg">
      <line x1="${P}" y1="${y(arr[0]).toFixed(1)}" x2="${W-P}" y2="${y(arr[0]).toFixed(1)}" class="chart-base"/>
      <path d="${area}" class="chart-area"/>
      <path d="${line}" class="chart-line"/>
      ${marks}
      <circle cx="${x(arr.length-1).toFixed(1)}" cy="${y(arr[arr.length-1]).toFixed(1)}" r="3.4" class="chart-now"/>
    </svg>
    <div class="chart-foot"><span>${tickLabel(firstTick)}</span><span>${marks ? '● 뉴스 발생 시점' : ''}</span><span>${tickLabel(m.tick)}</span></div>
  </div>`;
}
function changeInfo(now, before){
  if(!before || !now) return { cls:'flat', text:'0.00%' };
  const pct = (now - before) / before * 100;
  if(Math.abs(pct) < 0.005) return { cls:'flat', text:'0.00%' };
  return { cls: pct > 0 ? 'up' : 'down', text: (pct > 0 ? '▲ ' : '▼ ') + Math.abs(pct).toFixed(2) + '%' };
}
function fmtMan(won){ const a = Math.abs(won); return a >= 10000 ? (Math.round(a / 1000) / 10) + '만원' : Math.round(a).toLocaleString('ko-KR') + '원'; }
function renderGameMarket(){
  const g = state.game, m = g.market, p = g.player || {}, open = marketStatus().open;
  return `<div class="list">${GAME_STOCKS.map(s => {
    const price = m.prices[s.id] || 0;
    const ch = changeInfo(price, (m.prev || {})[s.id]);
    const have = (p.holdings || {})[s.id] || 0;
    return `
    <div class="stock-card">
      <div class="stock-top">
        <div>
          <div class="stock-name">${esc(s.name)} <span class="badge badge-alt">${esc(s.type)}</span></div>
          <div class="stock-price">${fmtWon(price)}</div>
          <span class="text-3 small stock-have">보유 ${have}주</span>
          <button type="button" class="link-btn chart-toggle" data-act="gameChart" data-stock="${s.id}">${g.chartOpen === s.id ? '그래프 닫기' : '그래프 보기'} ${icon('chevron')}</button>
        </div>
        <div class="stock-side ${ch.cls}">
          ${gameSparkline((m.history || {})[s.id])}
          <div class="stock-chg">${ch.text}</div>
        </div>
      </div>
      ${g.chartOpen === s.id ? renderStockChart(s, m) : ''}
      <div class="stock-trade">
        <input class="game-qty" type="number" min="1" step="1" inputmode="numeric" placeholder="수량" data-stock="${s.id}" value="${esc(g.qty[s.id] || '')}">
        <button type="button" class="btn btn-ghost btn-sm" data-act="gameMax" data-side="buy" data-stock="${s.id}">최대</button>
        ${have ? `<button type="button" class="btn btn-ghost btn-sm" data-act="gameMax" data-side="sell" data-stock="${s.id}">전량</button>` : ''}

function renderNewsAnalysis(n, active, sum){

  const bar = document.createElement('div'); bar.className = 'tick-cd-bar'; bar.hidden = true;
  const pill = document.createElement('div'); pill.className = 'tick-cd'; pill.hidden = true;
  pill.setAttribute('role', 'status'); pill.setAttribute('aria-live', 'off');
  pill.innerHTML = '<span class="dot"></span><span class="txt"></span>';
  document.body.appendChild(bar); document.body.appendChild(pill);
  tickCdEls = { bar, pill, txt: pill.querySelector('.txt') };
  return tickCdEls;
}
function updateTickCountdown(){
  const els = tickCountdownEls();
  const g = state.game;
  const show = !!(state.currentUser && g && g.controlLoaded && marketRunning() && canPlayGame());
  if(!show){ els.bar.hidden = true; els.pill.hidden = true; return; }
  const now = Date.now();
  const nextAt = nextMovingTick() * GAME_TICK_MS;
  // 방금 시세가 바뀌었으면 2.5초 동안 "시세가 바뀌었어요"를 보여줘요
  if(tickCdLastNext && nextAt !== tickCdLastNext && now >= tickCdLastNext && now - tickCdLastNext < 5000){
    tickCdDoneUntil = now + 2500;
    if(g.playAttached) gameSync(); // 게임 화면을 보고 있으면 바로 새 시세를 받아와요
  }
  tickCdLastNext = nextAt;
  if(now < tickCdDoneUntil){
    els.pill.hidden = false; els.bar.hidden = true;
    els.pill.className = 'tick-cd done';
    els.txt.textContent = '📈 시세 변동!';
    return;
  }
  const left = nextAt - now;
  if(left > TICK_CD_WINDOW || left <= 0){ els.bar.hidden = true; els.pill.hidden = true; return; }
  const sec = Math.ceil(left / 1000);
  els.pill.hidden = false; els.bar.hidden = false;
  els.pill.className = 'tick-cd' + (sec <= 5 ? ' urgent' : '');
  els.txt.textContent = '시세 변동까지 ' + sec + '초';
  els.bar.style.transform = 'scaleX(' + (left / TICK_CD_WINDOW).toFixed(4) + ')';
}
setInterval(updateTickCountdown, 250);

state.game = freshGameState();
bindEvents();
init();
</script>
